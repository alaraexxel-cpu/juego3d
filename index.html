<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imperio Chino 3D Real</title>
    <!-- Motor gráfico 3D optimizado para celulares -->
    <script src="https://aframe.io"></script>
    <style>
        body { margin: 0; overflow: hidden; font-family: sans-serif; user-select: none; }
        .control-pad { position: absolute; bottom: 30px; left: 50%; transform: translateX(-50%); display: grid; grid-template-columns: repeat(3, 75px); grid-template-rows: repeat(3, 75px); gap: 12px; z-index: 10; }
        .btn-control { background: rgba(0, 0, 0, 0.65); color: white; border: 2px solid #ffd700; border-radius: 50%; font-size: 26px; display: flex; align-items: center; justify-content: center; -webkit-user-select: none; }
        .btn-control:active { background: rgba(255, 215, 0, 0.4); }
        #btn-arriba { grid-column: 2; grid-row: 1; }
        #btn-izquierda { grid-column: 1; grid-row: 2; }
        #btn-abajo { grid-column: 2; grid-row: 3; }
        #btn-derecha { grid-column: 3; grid-row: 2; }
        .titulo { position: absolute; top: 15px; width: 100%; text-align: center; color: #ffd700; text-shadow: 2px 2px 4px #000; z-index: 10; margin: 0; font-size: 20px; letter-spacing: 1px; }
    </style>
</head>
<body>

    <h2 class="titulo">⛩️ Reino Imperial 3D ⛩️</h2>

    <!-- Controles táctiles en pantalla -->
    <div class="control-pad">
        <div class="btn-control" id="btn-arriba" ontouchstart="iniciarMov('arriba')" ontouchend="detenerMov()" mousedown="iniciarMov('arriba')" mouseup="detenerMov()">⬆️</div>
        <div class="btn-control" id="btn-izquierda" ontouchstart="iniciarMov('izquierda')" ontouchend="detenerMov()" mousedown="iniciarMov('izquierda')" mouseup="detenerMov()">⬅️</div>
        <div class="btn-control" id="btn-abajo" ontouchstart="iniciarMov('abajo')" ontouchend="detenerMov()" mousedown="iniciarMov('abajo')" mouseup="detenerMov()">⬇️</div>
        <div class="btn-control" id="btn-derecha" ontouchstart="iniciarMov('derecha')" ontouchend="detenerMov()" mousedown="iniciarMov('derecha')" mouseup="detenerMov()">➡️</div>
    </div>

    <!-- ESCENA 3D REAL COMPATIBLE -->
    <a-scene embedded vr-mode-ui="enabled: false">
        
        <!-- Suelo tridimensional extendido (Terreno Verde Imperial) -->
        <a-plane position="0 0 0" rotation="-90 0 0" width="60" height="60" color="#1e4620"></a-plane>
        
        <!-- El cielo nocturno / místico -->
        <a-sky color="#111216"></a-sky>

        <!-- Luces ambientales y direccionales para generar volumen real -->
        
        

        <!-- Tu Guerrera Imperial en 3D (Cilindro texturizado con la imagen que elegiste) -->
        
            <a-cylinder radius="0.45" height="1.5" color="#ffffff" src="https://ibb.co"></a-cylinder>
        

        <!-- Estructuras de referencia en el mapa para apreciar la profundidad de la cámara -->
        <a-box position="3 1 -7" depth="2" height="2" width="2" color="#b22222"></a-box>
        <a-box position="-4 0.5 -5" depth="1" height="1" width="1" color="#444444"></a-box>

    </a-scene>

    <script>
        let intervalo = null;
        let dir = null;
        const jugador = document.getElementById('jugador');
        const velocidad = 0.09; // Velocidad del movimiento en metros 3D

        function actualizar3D() {
            if (!dir) return;
            let pos = jugador.getAttribute('position');

            if (dir === 'arriba') pos.z -= velocidad;
            if (dir === 'abajo') pos.z += velocidad;
            if (dir === 'izquierda') pos.x -= velocidad;
            if (dir === 'derecha') pos.x += velocidad;

            jugador.setAttribute('position', pos);
        }

        function iniciarMov(direccion) {
            if (intervalo) return;
            dir = direccion;
            intervalo = setInterval(actualizar3D, 16); // 60 fotogramas por segundo fluidos
        }

        function detenerMov() {
            clearInterval(intervalo);
            intervalo = null;
            dir = null;
        }
    </script>
</body>
  </html>
